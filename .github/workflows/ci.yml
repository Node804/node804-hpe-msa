name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow executes repository code (tests), so it gets
# only read access to the checkout and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dependencies
        # node804-mcp-toolkit is a declared dependency and resolves from PyPI
        # with the rest of the extras.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -v -m "not integration"
