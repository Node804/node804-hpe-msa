name: Publish to PyPI

# Tag a release to publish, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag version must match __version__ in src/hpe_msa_mcp/__init__.py.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo. Configure
# the publisher once at https://pypi.org/manage/project/node804-hpe-msa-mcp/settings/publishing/
# (workflow: publish.yml, environment: pypi) and create a GitHub environment named
# "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
