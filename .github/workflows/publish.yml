name: Publish to PyPI

# Tag a release to publish, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag version must match __version__ in src/hpe_msa_mcp/__init__.py.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo. Configure
# the publisher once at https://pypi.org/manage/project/node804-hpe-msa-mcp/settings/publishing/
# (workflow: publish.yml, environment: pypi) and create a GitHub environment named
# "pypi".

on:
  push:
    tags: ["v*"]

# Default to read-only for every job; the publish job opts into id-token below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assert tag matches package version
        # Refuse to build a release whose tag doesn't match __version__, so a
        # mistyped tag can never publish the wrong version to PyPI.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import sys; sys.path.insert(0, "src"); import hpe_msa_mcp; print(hpe_msa_mcp.__version__)')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match package version $ver"; exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
